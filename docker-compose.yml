services:
  db:
    image: pgvector/pgvector:pg16
    container_name: eduadapt_db
    environment:
      POSTGRES_DB: eduadaptdb
      POSTGRES_USER: eduuser
      POSTGRES_PASSWORD: edupassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: eduadapt_backend
    command: >
      sh -c "python manage.py migrate &&
             python seed_demo.py &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-hackathon-key}
      - DEBUG=True
      - DATABASE_URL=postgres://eduuser:edupassword@db:5432/eduadaptdb
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: eduadapt_frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  pgdata: